[build]
  command = "npm run build"
  publish = "."

# JS y CSS llevan ?v= calculado desde su contenido, así que una caché larga
# no sirve versiones viejas. Las imágenes no llevan hash en el nombre.

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/asset/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/admin-recetas.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/productos"
  to = "/productos/"
  status = 301
  force = true

[[redirects]]
  from = "/productos.html"
  to = "/productos/"
  status = 301
  force = true

[[redirects]]
  from = "/recetas"
  to = "/recetas.html"
  status = 301
  force = true
